# LDS-03 (coin_d4_driver) + 자기 몸 지우기 필터. tb-only.launch.py가 읽음.
# 라이다 scan_raw → 필터(로봇 몸통 base_link 기준 상자 안 점 제거) scan_filtered → scan_resample(고정 칸) → /scan.
# 라이다가 1층 앞에 있어 뒤쪽 반은 모터·지지대·바퀴가 찍힘 → 이걸 안 지우면 SLAM이 몸통을 벽으로 그림.
coin_d4_driver:
  ros__parameters:
    port: /dev/tb3_lidar        # udev: documents/raspberry/udev-setup.md (CP2102 USB2LDS)
    frame_id: base_scan
    baudrate: 230400
    version: 4
    topic_name: scan_raw
    reverse: false
    warmup_time: 5

scan_filter:
  ros__parameters:
    filter1:
      name: robot_body
      type: laser_filters/LaserScanBoxFilter
      params:
        box_frame: base_link
        # 몸통 + 바퀴 + 여유 1cm (urdf: x -0.197~0.069, 바퀴 y ±0.153). 라이다(중심 x 0.060) 뒤쪽까지만
        min_x: -0.207
        max_x: 0.035
        min_y: -0.165
        max_y: 0.165
        min_z: -0.05
        max_z: 0.20
        invert: false

scan_resample:
  ros__parameters:
    # LDS-03는 한 바퀴 점 개수가 395~404로 매번 다름 → slam_toolbox가 첫 개수와 다른 스캔을 버림
    # ("LaserRangeScan contains 403 range readings, expected 404") → 고정 칸으로 다시 나눔
    beams: 400                  # 360° / 400 = 0.9° (LDS-03 분해능)
