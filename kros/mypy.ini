[mypy]
strict = True
explicit_package_bases = True
mypy_path = ..
exclude = (^|/)\.venv/

# 타입 정보(stub)가 없는 외부 라이브러리
[mypy-panda3d.*]
ignore_missing_imports = True
[mypy-direct.*]
ignore_missing_imports = True
[mypy-cupy.*]
ignore_missing_imports = True
[mypy-numpy.*]
ignore_missing_imports = True
[mypy-onnxruntime.*]
ignore_missing_imports = True
