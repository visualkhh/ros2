# ROS 2 Lyrical on Ubuntu 26.04 — 템플릿 compose
# 원본: /home/pank/workspaces/pa/source/Lv2_bee_Assignment/docker/docker-compose.yml (24.04 Jetson용)
# 26.04에서는 Lv2 경로(../lv2_module6/...)를 자신의 워크스페이스로 바꿔서 사용.
# 사용법: 이 폴더(documents/docker)에서 바로 테스트 가능. 실사용은 프로젝트 루트로 복사.
#   docker compose build
#   docker compose up -d && docker compose exec lyrical bash
#   (컨테이너 안) build-ws
services:
  lyrical:
    build:
      context: .
      dockerfile: Dockerfile
    image: lyrical-26.04:testbed
    container_name: lyrical_2604
    working_dir: /ws
    # DDS 공유 메모리 — Docker 기본 /dev/shm 64MB면 Fast DDS가 큰 영상을 공유 메모리로 못 보내고
    # 조각난 UDP로 보내다 구독자가 많은 영상을 거의 다 잃음. fastdds.xml이 노드마다 32MB 구역 요구.
    shm_size: 4gb
    # 같은 LAN의 다른 팀 스택과 DDS가 섞이지 않게 도메인 분리 (기본 0이면 토픽 가로챔)
    environment:
      - ROS_DOMAIN_ID=25
      # SUBNET (= ROS 기본값). LOCALHOST로 두면 Fast DDS가 멀티캐스트 대신 일부에만 discovery를 보내
      # 노드 수십 개 중 일부가 서로 안 보였다는 실측이 있음. 다른 팀 DDS와 섞임은 ROS_DOMAIN_ID가 막음.
      - ROS_AUTOMATIC_DISCOVERY_RANGE=SUBNET
      # Fast DDS TypeLookup 끔 (노드 많을 때 UDP 폭주 방지) — 설명은 fastdds.xml 안
      - FASTDDS_DEFAULT_PROFILES_FILE=/ws/fastdds.xml
    volumes:
      # 템플릿 기본: 같은 폴더 기준. 실프로젝트에서는 자신의 ros2_ws 경로로 변경.
      # 예: - ../../ros2_ws/src:/ws/src
      - ./example_ws/src:/ws/src
      - ./fastdds.xml:/ws/fastdds.xml
      # 빌드 산출물(build·install·log)은 컨테이너 안. 호스트 참고용 복사는 build-ws가 /debug에 복사하는 방식 사용 시 추가:
      # - ./debug:/debug
    stdin_open: true
    tty: true
    network_mode: host
    command: bash
