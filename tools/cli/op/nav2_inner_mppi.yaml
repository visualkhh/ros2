      inner:
        # Nav2 MPPI — Pi 4에서 무겁지 않게 batch/time을 줄인 값. 속도는 이 로봇 상한(0.26 m/s · 1.82 rad/s).
        time_steps: 40
        model_dt: 0.05
        model_delay_vx: 0.0
        model_delay_vy: 0.0
        model_delay_wz: 0.0
        batch_size: 1000
        open_loop: false
        ax_max: 2.5
        ax_min: -2.5
        ay_max: 0.0
        ay_min: 0.0
        az_max: 3.2
        vx_std: 0.2
        vy_std: 0.0
        wz_std: 0.4
        vx_max: 0.26
        vx_min: 0.0
        vy_max: 0.0
        wz_max: 1.82
        iteration_count: 1
        temperature: 0.3
        gamma: 0.015
        visualize: false
        publish_optimal_trajectory: false
        regenerate_noises: true
        motion_model: "diff_drive"
        diff_drive:
          plugin: "mppi::DiffDriveMotionModel"
        TrajectoryVisualizer:
          trajectory_step: 5
          time_step: 3
        TrajectoryValidator:
          plugin: "mppi::DefaultOptimalTrajectoryValidator"
          collision_lookahead_time: 2.0
          consider_footprint: false
        critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
                  "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
        ConstraintCritic:
          enabled: true
          cost_power: 1
          cost_weight: 4.0
        GoalCritic:
          enabled: true
          cost_power: 1
          cost_weight: 5.0
          threshold_to_consider: 1.4
        GoalAngleCritic:
          enabled: true
          cost_power: 1
          cost_weight: 3.0
          threshold_to_consider: 0.5
        PreferForwardCritic:
          enabled: true
          cost_power: 1
          cost_weight: 5.0
          threshold_to_consider: 0.5
        CostCritic:
          enabled: true
          cost_power: 1
          cost_weight: 3.81
          near_collision_cost: 253
          critical_cost: 300.0
          consider_footprint: false
          collision_cost: 1000000.0
          near_goal_distance: 1.0
          trajectory_point_step: 2
        PathAlignCritic:
          enabled: true
          cost_power: 1
          cost_weight: 14.0
          max_path_occupancy_ratio: 0.05
          trajectory_point_step: 4
          threshold_to_consider: 0.5
          offset_from_furthest: 20
          use_path_orientations: false
        PathFollowCritic:
          enabled: true
          cost_power: 1
          cost_weight: 5.0
          offset_from_furthest: 5
          threshold_to_consider: 1.4
        PathAngleCritic:
          enabled: true
          cost_power: 1
          cost_weight: 2.0
          offset_from_furthest: 4
          threshold_to_consider: 0.5
          max_angle_to_furthest: 1.0
          mode: 0
