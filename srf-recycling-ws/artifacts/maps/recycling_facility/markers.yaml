# srf map markers (map_marker). 단위: m, rad. 자세 = position + orientation[x,y,z,w]
markers:
  - name: robot_home
    kind: home
    frame_id: map
    position: [2.2, 3.9, 0]
    orientation: [0, 0, 0, 1]
    properties: {role: start}
  - name: work_mat
    kind: pick
    frame_id: map
    position: [4, 3.9, 0.002]
    orientation: [0, 0, 0, 1]
    scale: [0.8, 0.8, 0]
    properties: {role: supply_drop, surface: rubber_mat}
  - name: work_mat_approach
    kind: waypoint
    frame_id: map
    position: [3.3, 3.9, 0]
    orientation: [0, 0, 0, 1]
    properties: {for: work_mat}
  - name: bin_can
    kind: drop
    frame_id: map
    position: [7.6, 2.9, 0.1]
    orientation: [0, 0, 0, 1]
    scale: [0.24, 0.24, 0.1]
    properties: {category: can, capacity: 5}
  - name: bin_can_approach
    kind: waypoint
    frame_id: map
    position: [7.18, 2.9, 0]
    orientation: [0, 0, 0, 1]
    properties: {for: bin_can}
  - name: bin_pet
    kind: drop
