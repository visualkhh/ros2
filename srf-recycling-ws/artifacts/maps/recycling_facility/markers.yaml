zones:
  - name: robot_cell
    kind: info
    frame_id: map
    shape: polygon
    polygon: [[1, 1], [9, 1], [9, 6.8], [1, 6.8]]
    properties: {owner: robot}
  - name: work_area_slow
    kind: speed
    frame_id: map
    shape: polygon
    polygon: [[3.1, 3], [4.9, 3], [4.9, 4.8], [3.1, 4.8]]
    properties: {speed_limit: 0.12}
  - name: bins_slow
    kind: speed
    frame_id: map
    shape: polygon
    polygon: [[6.9, 2.4], [7.9, 2.4], [7.9, 5.4], [6.9, 5.4]]
    properties: {speed_limit: 0.10}
  - name: walkway
    kind: keepout
